name: Run Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # TA-Lib works best with 3.8-3.10

    - name: Install TA-Lib C library
      run: |
        sudo apt-get update
        # libtool and autoconf might be needed if configure script needs regeneration,
        # good to have them for build-from-source scenarios.
        sudo apt-get install -y build-essential wget libtool autoconf
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        # The --prefix=/usr ensures it installs to standard system locations
        # /usr/lib for libraries, /usr/include for headers
        ./configure --prefix=/usr
        make
        sudo make install
        cd ..
        rm -rf ta-lib ta-lib-0.4.0-src.tar.gz
        # Crucial step: Update the dynamic linker cache
        sudo ldconfig

    - name: Install Python dependencies
      # Set environment variables to explicitly tell the ta-lib Python package where to find the C library
      # TA_INCLUDE_PATH should point to the directory containing the 'ta-lib' subdir (e.g., /usr/include)
      # TA_LIBRARY_PATH should point to the directory containing libta_lib.so (e.g., /usr/lib)
      env:
        TA_INCLUDE_PATH: /usr/include
        TA_LIBRARY_PATH: /usr/lib
      run: |
        python -m pip install --upgrade pip
        pip install wheel  # Ensure wheel is available
        pip install -r requirements.txt

    - name: Verify TA-Lib installation
      run: |
        python -c "import talib; print('TA-Lib version:', talib.__version__)"

    - name: Run tests
      run: |
        python -m pytest