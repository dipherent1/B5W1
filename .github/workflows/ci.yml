name: Windows CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # Match your Python version

    - name: Install C++ Build Tools
      run: |
        choco install vcpython27 -y  # For Python 2.7 compatibility
        choco install visualstudio2022-workload-vctools -y --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        # Install numpy first as TA-Lib depends on it
        pip install numpy
        # Install from requirements.txt which should reference your wheel
        pip install -r requirements.txt

    - name: Verify TA-Lib installation
      run: |
        python -c "import talib; print('TA-Lib version:', talib.__version__)"

    - name: Run tests
      run: |
        python -m pytest