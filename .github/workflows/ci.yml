name: Run Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install TA-Lib C library
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget autoconf libtool pkg-config
        wget https://downloads.sourceforge.net/project/ta-lib/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
        sudo ldconfig
        cd ..
        rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

    - name: Debug TA-Lib installation
      run: |
        echo "--- Checking TA-Lib installation ---"
        ls -lAh /usr/lib/libta_lib*
        ls -lAh /usr/include/ta-lib/
        ls -lAh /usr/lib/pkgconfig/ta-lib.pc || echo "ta-lib.pc not found, check TA_INCLUDE_PATH and TA_LIBRARY_PATH."

    - name: Install Python dependencies
      env:
        TA_INCLUDE_PATH: /usr/include/ta-lib
        TA_LIBRARY_PATH: /usr/lib
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        pip install "numpy<2.0"
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest
