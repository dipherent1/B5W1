name: Run Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # TA-Lib works best with 3.8-3.10
        
    - name: Install TA-Lib system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
        cd ..
        rm -rf ta-lib ta-lib-0.4.0-src.tar.gz
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel  # Ensure wheel is available
        pip install -r requirements.txt
        
    - name: Verify TA-Lib installation
      run: |
        python -c "import talib; print('TA-Lib version:', talib.__version__)"
        
    - name: Run tests
      run: |
        python -m pytest