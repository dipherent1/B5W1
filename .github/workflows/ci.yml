name: Run Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install TA-Lib system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget
        wget https://downloads.sourceforge.net/project/ta-lib/ta-lib/0.4.0/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make -j$(nproc)
        sudo make install
        sudo ldconfig  # Refresh library cache
        cd ..
        rm -rf ta-lib ta-lib-0.4.0-src.tar.gz
        
    - name: Verify TA-Lib installation
      run: |
        ldconfig -p | grep ta_lib  # Check library is found
        ls -lh /usr/lib/libta_lib*  # Verify library files
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel numpy  # Install numpy first as TA-Lib depends on it
        TA_LIBRARY_PATH=/usr/lib TA_INCLUDE_PATH=/usr/include pip install ta-lib
        pip install -r requirements.txt
        
    - name: Verify Python can import TA-Lib
      run: |
        python -c "import talib; print('TA-Lib version:', talib.__version__)"
        
    - name: Run tests
      run: |
        python -m pytest